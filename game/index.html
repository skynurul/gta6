<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — an open-world crime story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a3a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .panel { background: rgba(10, 20, 30, 0.55); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(2px); }
  #topleft { position: absolute; top: 14px; left: 14px; display: flex; flex-direction: column; gap: 8px; }
  #cash { font-size: 26px; font-weight: 800; color: #7cf29c; }
  #health-row { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  #health-bar { width: 150px; height: 12px; background: rgba(0,0,0,.5); border-radius: 6px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #37d67a, #a7f3d0); transition: width .2s; }
  #health-fill.low { background: linear-gradient(90deg, #ef4444, #fca5a5); }
  #topright { position: absolute; top: 14px; right: 14px; text-align: right; }
  #stars { font-size: 30px; letter-spacing: 3px; color: #ffd60a; }
  #stars.hot { animation: blink 0.7s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.45; } }
  #wanted-label { font-size: 11px; letter-spacing: 2px; opacity: .85; }
  #mission { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); text-align: center; max-width: 560px; }
  #mission-title { font-size: 13px; letter-spacing: 3px; color: #ffd60a; font-weight: 800; }
  #mission-text { font-size: 16px; font-weight: 600; margin-top: 2px; }
  #minimap-wrap { position: absolute; left: 14px; bottom: 14px; }
  #minimap { width: 180px; height: 180px; border-radius: 10px; border: 2px solid rgba(255,255,255,.35); display: block; background: #3aa7a3; }
  #map-label { font-size: 11px; letter-spacing: 2px; margin-top: 4px; opacity: .9; }
  #speedo { position: absolute; right: 14px; bottom: 14px; text-align: right; }
  #speed { font-size: 30px; font-weight: 800; }
  #car-name { font-size: 13px; opacity: .9; }
  #toast { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 700; background: rgba(10,20,30,.72); border: 1px solid rgba(255,214,10,.5); border-radius: 10px; padding: 10px 18px; opacity: 0; transition: opacity .25s; max-width: 640px; text-align: center; }
  #toast.show { opacity: 1; }
  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(10,25,45,.25), rgba(10,25,45,.78)); pointer-events: auto; }
  #menu.hidden, #busted.hidden { display: none; }
  #menu-card { text-align: center; max-width: 620px; padding: 34px 44px; background: rgba(8, 18, 30, 0.82); border: 1px solid rgba(255,214,10,.45); border-radius: 18px; color: #fff; }
  #menu-title { font-size: 54px; font-weight: 900; letter-spacing: 6px; margin: 0; color: #ffd60a; text-shadow: 0 3px 0 #b45309, 0 6px 18px rgba(0,0,0,.6); }
  #menu-body p { font-size: 17px; line-height: 1.5; margin: 10px 0; }
  #menu-body .tagline { font-size: 19px; color: #7dd3fc; font-style: italic; }
  #menu-body .controls { font-size: 14px; opacity: .9; background: rgba(255,255,255,.08); border-radius: 8px; padding: 10px; }
  #menu-body .big { font-size: 22px; font-weight: 800; }
  #menu-body .save-note { color: #7cf29c; font-weight: 700; }
  #menu-hint { margin-top: 18px; font-size: 15px; letter-spacing: 1px; color: #ffd60a; font-weight: 700; animation: blink 1.4s steps(2) infinite; }
  #busted { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(20,0,0,.55); pointer-events: auto; color: #fff; }
  #busted h1 { font-size: 84px; font-weight: 900; letter-spacing: 10px; color: #fff; margin: 0; text-shadow: 0 4px 0 #7f1d1d, 0 8px 24px rgba(0,0,0,.7); }
  #busted p { font-size: 18px; max-width: 520px; text-align: center; line-height: 1.5; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: drive, steal cars, dodge the police and run jobs across an open city"></canvas>
<div id="hud">
  <div id="topleft">
    <div class="panel"><span id="cash">$40</span></div>
    <div class="panel" id="health-row">❤ <span id="health-bar"><span id="health-fill"></span></span> <span id="health-text">100</span></div>
  </div>
  <div id="topright">
    <div id="stars">☆☆☆☆☆</div>
    <div id="wanted-label">SOLMAR BAY PD</div>
  </div>
  <div id="minimap-wrap">
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="map-label">SOLMAR BAY</div>
  </div>
  <div id="mission" class="panel">
    <div id="mission-title">SOLMAR BAY</div>
    <div id="mission-text">Press Enter to play.</div>
  </div>
  <div id="speedo">
    <div id="speed"></div>
    <div id="car-name">On foot</div>
  </div>
  <div id="toast"></div>
</div>
<div id="menu">
  <div id="menu-card">
    <h1 id="menu-title">SOLMAR BAY</h1>
    <div id="menu-body"></div>
    <div id="menu-hint">Press Enter or click to play</div>
  </div>
</div>
<div id="busted" class="hidden">
  <h1>BUSTED</h1>
  <p></p>
  <p style="color:#ffd60a;font-weight:700">Press Enter to keep playing.</p>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
